# Benchmark configuration. Code reads every setting from here; nothing below is
# hard-coded in src/. Changing a value after the protocol is frozen creates a
# *revised* protocol (see docs/protocol.md).

dataset:
  name: "Lobachevsky University Electrocardiography Database (LUDB)"
  version: "1.0.1"
  base_url: "https://physionet.org/files/ludb/1.0.1"
  raw_dir: "data/raw/ludb-1.0.1"
  n_records: 200
  expected_fs: 500
  expected_samples: 5000

task:
  lead: "ii"                 # selected by channel name, never by index
  lead_display_name: "Lead II"
  qrs_peak_symbol: "N"       # LUDB QRS peak marker (a placeholder, not a beat diagnosis)
  scoring_window_s: [3.0, 7.0]   # same window for every record and method
  tolerance_s: 0.150         # project event-matching rule, not a clinical threshold
  secondary_tolerances_s: [0.050, 0.025]  # reported alongside; added 2026-10-28 after dev pilot hit a ceiling

split:
  seed: 42
  n_dev: 100
  n_test: 100
  n_pilot: 20                # drawn from dev only

case_ids:
  # Opaque IDs for model-facing files: HMAC-SHA256(salt, record) truncated.
  salt: "ludb-qrs-bench-v1"
  length: 10

render:
  overview:                  # the image every model condition receives
    width_px: 2400
    height_px: 600
    dpi: 100
  zoom_master:               # high-resolution clean render the zoom tool crops from
    width_px: 12000
    height_px: 900
    dpi: 100
  major_grid_s: 0.2
  minor_grid_s: 0.04
  major_grid_mv: 0.5
  minor_grid_mv: 0.1
  x_tick_label_every_s: 0.5  # overview; zoom master labels every major grid line
  y_margin_mv: 0.3
  line_width: 1.0
  shade_scoring_window: true # same fixed window on every image; reveals no answers
  transform: "none"          # raw physical-unit signal: no filtering, resampling or detrending

zoom:
  max_calls: 6
  min_span_s: 0.4
  max_span_s: 10.0
  max_output_long_edge_px: 2400

models:
  # Exact identifiers sent to the provider. The roster is NOT part of the frozen
  # protocol hash: models added later run under the same frozen task, images,
  # prompts and scorer, and every attempt logs its exact settings. Each model also
  # needs a pricing_usd_per_mtok entry (0/0 for a local server) or the runner refuses.
  # How to add OpenAI, Gemini and open-weight models: docs/models.md.
  - provider: anthropic
    model: "claude-opus-5-5"
    effort: "high"
    max_tokens: 16000
    structured_output: true   # output_config.format JSON schema; responses are still validated
  - provider: anthropic
    model: "claude-sonnet-5-5"
    effort: "high"
    max_tokens: 16000
    structured_output: true   # output_config.format JSON schema; responses are still validated

  # Via an OpenAI-compatible model router (URL and key in .env), added 2026-10-29. Effort "high" for every model,
  # matching the Claude runs. Router chat completions does not accept host pinning; the serving host is logged.
  - provider: openai_compat          # closed, Google
    model: "gemini-4-argon"
    base_url_env: "ROUTER_BASE_URL"
    api_key_env: "ROUTER_API_KEY"
    max_tokens: 16000
    structured_output: true
    extra_body: {reasoning_effort: "high"}
  - provider: openai_compat          # closed, OpenAI
    model: "gpt-6.1-sol"
    base_url_env: "ROUTER_BASE_URL"
    api_key_env: "ROUTER_API_KEY"
    max_tokens: 16000
    structured_output: true
    extra_body: {reasoning_effort: "high"}
  - provider: openai_compat          # closed, xAI
    model: "grok-4.7"
    base_url_env: "ROUTER_BASE_URL"
    api_key_env: "ROUTER_API_KEY"
    max_tokens: 16000
    structured_output: true
    extra_body: {reasoning_effort: "high"}
  - provider: openai_compat          # closed cheap, Google
    model: "gemini-3.8-flash"
    base_url_env: "ROUTER_BASE_URL"
    api_key_env: "ROUTER_API_KEY"
    max_tokens: 16000
    structured_output: true
    extra_body: {reasoning_effort: "high"}
  - provider: openai_compat          # closed cheap, OpenAI
    model: "gpt-5.6-luna"
    base_url_env: "ROUTER_BASE_URL"
    api_key_env: "ROUTER_API_KEY"
    max_tokens: 16000
    structured_output: true
    extra_body: {reasoning_effort: "high"}
  - provider: openai_compat          # open-weight (to verify), host chosen by Router (logged per attempt)
    model: "deepseek-v4.1-flash"
    base_url_env: "ROUTER_BASE_URL"
    api_key_env: "ROUTER_API_KEY"
    max_tokens: 16000
    structured_output: false        # with tools + response_format its hosts answered [] at once without zooming (dev smoke, results/dev/runs/diag-deepseek-nostruct)
    extra_body: {reasoning_effort: "high"}
  - provider: openai_compat          # open-weight (to verify), host chosen by Router (logged per attempt)
    model: "muse-spark-open"
    base_url_env: "ROUTER_BASE_URL"
    api_key_env: "ROUTER_API_KEY"
    max_tokens: 16000
    structured_output: true
    extra_body: {reasoning_effort: "high"}
  - provider: openai_compat          # open-weight (to verify), host chosen by Router (logged per attempt); no tool support listed: image_only
    model: "kimi-k3"
    base_url_env: "ROUTER_BASE_URL"
    api_key_env: "ROUTER_API_KEY"
    max_tokens: 16000
    structured_output: true
    extra_body: {reasoning_effort: "high"}
  # Templates (commented out until a key and a verified model id exist; see docs/models.md):
  # - provider: openai_compat          # closed: OpenAI
  #   model: "<exact OpenAI model id>"
  #   base_url: "https://api.openai.com/v1"
  #   api_key_env: "OPENAI_API_KEY"
  #   max_tokens: 16000
  #   max_tokens_param: "max_completion_tokens"
  #   structured_output: true
  #   strict_tools: true
  #   extra_body: {reasoning_effort: "high"}
  # - provider: openai_compat          # closed: Google Gemini (OpenAI-compatible endpoint)
  #   model: "<exact Gemini model id>"
  #   base_url: "https://generativelanguage.googleapis.com/v1beta/openai"
  #   api_key_env: "GEMINI_API_KEY"
  #   max_tokens: 16000
  #   structured_output: true
  # - provider: openai_compat          # open weights, hosted router
  #   model: "<router model id, e.g. a Qwen VL or MedGemma checkpoint>"
  #   base_url: "https://openrouter.ai/api/v1"
  #   api_key_env: "OPENROUTER_API_KEY"
  #   max_tokens: 4000
  #   structured_output: false        # many open models lack it; responses are validated anyway
  # - provider: openai_compat          # open weights, local vLLM or Ollama server
  #   model: "<served model name>"
  #   base_url: "http://localhost:8000/v1"
  #   api_key_env: null
  #   max_tokens: 4000
  #   structured_output: false

conditions: ["image_only", "image_zoom"]

execution:
  attempts_per_case: 1
  max_turns: 10              # model calls per attempt (zoom condition); image_only uses 1
  infra_retries: 3           # retries for designated infrastructure errors only
  retry_backoff_s: [5, 20, 60]
  request_timeout_s: 600

pricing_usd_per_mtok:        # from Anthropic pricing table cached 2026-10-06; verify before paid runs
  claude-opus-5-5: {input: 4.00, output: 20.00}
  claude-sonnet-5-5: {input: 2.00, output: 10.00}
  claude-haiku-5-5: {input: 0.10, output: 0.50}
  # Router catalog prices (GET /v1/models, 2026-10-29)
  gemini-4-argon: {input: 4.00, output: 20.00}
  gpt-6.1-sol: {input: 2.00, output: 10.00}
  grok-4.7: {input: 2.00, output: 6.00}
  gemini-3.8-flash: {input: 0.75, output: 3.75}
  gpt-5.6-luna: {input: 0.20, output: 1.20}
  "deepseek-v4.1-flash": {input: 0.30, output: 1.20}
  "muse-spark-open": {input: 1.25, output: 4.25}
  "kimi-k3": {input: 3.00, output: 15.00}

budget:
  max_spend_usd: 55.0        # hard cap on estimated spend; raise deliberately before larger runs
  first_attempt_estimate_usd: 0.25  # used before any measured cost exists

baseline:
  method: "wfdb.processing.XQRS"
  peak_correction: "wfdb.processing.correct_peaks"   # snaps XQRS output to local extremum
  correct_search_radius_s: 0.05
  correct_smooth_window_s: 0.15

report:
  # Final tables (`report` command). Unit of resampling = case (record = subject).
  n_bootstrap: 10000
  bootstrap_seed: 20261028
  # Subgroups (paced, atrial_fibrillation, neither) are defined from the private
  # header diagnoses in src/ecgbench/analysis.py: SUBGROUP_RULES.
